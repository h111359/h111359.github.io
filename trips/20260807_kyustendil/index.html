<!DOCTYPE html>
<!--
  index.html: Copy-ready entry point for a new static trip journal.
  Component: Trip Gallery Template — provides accessible event navigation, gallery content, and media dialog.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="themeColor" name="theme-color" content="#f4efe5">
  <meta
    id="pageDescription"
    name="description"
    content="A family trip journal with photos, videos, and stories."
  >
  <title>New trip journal</title>
  <link rel="stylesheet" href="/trips/shared/gallery.css">
</head>
<body>
  <!-- Skip link: Enter moves keyboard users directly to the current event content. -->
  <a class="skip-link" id="skipLink" href="#main-content">Skip to content</a>

  <!--
    Hero Section
    Design intent: A restrained editorial cover establishes the trip before navigation and media.
    Target: All viewports; typography scales fluidly while preserving the reading hierarchy.
  -->
  <header class="hero" id="siteHeader">
    <div class="hero__inner">
      <p class="hero__eyebrow" id="heroEyebrow">Travel journal</p>
      <h1 id="heroHeading">New trip journal</h1>
      <p class="hero__subtitle" id="heroSubtitle">Photos, videos, and stories</p>
      <p class="hero__facts" id="tripFacts" hidden></p>

      <!-- Drawer trigger: native Enter/Space behavior; aria-expanded reports the compact drawer state. -->
      <button
        class="navigator-trigger"
        id="openNavigator"
        type="button"
        aria-controls="eventNavigator"
        aria-expanded="false"
        aria-label="Open event navigator"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
        <span id="navigatorTriggerLabel">Events</span>
      </button>
    </div>
  </header>

  <!-- Drawer scrim: pointer dismissal supplements the explicit keyboard-accessible close button. -->
  <div class="drawer-scrim" id="drawerScrim" aria-hidden="true"></div>

  <!--
    Journal Layout
    Design intent: A date-grouped itinerary anchors a spacious, media-first reading column.
    Target: Side-by-side on wide screens and a modal navigator on compact screens.
  -->
  <div class="journal-layout">
    <!-- Event navigator: Tab stays contained and Escape closes it when presented as a compact dialog. -->
    <aside class="navigator" id="eventNavigator" aria-label="Trip events">
      <div class="navigator__header">
        <div>
          <p class="section-kicker" id="routeKicker">Route</p>
          <h2 id="journalHeading">Trip journal</h2>
        </div>

        <!-- Drawer close: native Enter/Space behavior; the label is supplied by trip configuration. -->
        <button
          class="navigator__close"
          id="closeNavigator"
          type="button"
          aria-label="Close event navigator"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>

      <!-- Search: the visible label names the field and the result count is announced below it. -->
      <form class="event-search" role="search">
        <label id="eventSearchLabel" for="eventSearch">Search events</label>
        <div class="event-search__field">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <input
            id="eventSearch"
            type="search"
            inputmode="search"
            autocomplete="off"
            placeholder="Place or experience"
          >
        </div>
      </form>

      <p class="navigator__summary" id="navSummary" role="status" aria-live="polite"></p>
      <!-- Event controls are generated from data/events.js and grouped by dates in their slugs or titles. -->
      <nav class="event-groups" id="eventGroups" aria-label="Events by date"></nav>
    </aside>

    <!--
      Current Event
      Design intent: Quiet event context lets authored photography and stories lead.
      Target: The main reading region at every viewport.
    -->
    <main class="journal" id="main-content" tabindex="-1">
      <header class="event-heading">
        <p class="event-heading__date" id="eventDate"></p>
        <h2 id="eventTitle">Loading the trip…</h2>
        <p class="event-heading__status" id="eventStatus" role="status" aria-live="polite"></p>
      </header>
      <div class="gallery" id="gallery" aria-busy="true"></div>
    </main>
  </div>

  <!--
    Media Dialog
    Design intent: A calm full-screen viewing surface with no carousel or browsing controls.
    Keyboard: Tab remains within the dialog, Escape closes it, and focus returns to its trigger.
  -->
  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-labelledby="lightboxTitle"
    hidden
  >
    <h2 class="visually-hidden" id="lightboxTitle">Media preview</h2>
    <!-- Lightbox close: native Enter/Space behavior and an additional Escape-key handler. -->
    <button class="lightbox__close" id="closeLightbox" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
      <span id="lightboxCloseLabel">Close</span>
    </button>
    <div class="lightbox__body" id="lightboxBody"></div>
  </div>

  <!-- No-script state: static event records require JavaScript, so the limitation is explicit. -->
  <noscript>
    <div class="noscript-message" role="status">
      Enable JavaScript to view the trip photos, videos, and stories.
    </div>
  </noscript>

  <!-- Trip identity and local data load before the root-relative reusable controller. -->
  <script src="trip-config.js" charset="utf-8"></script>
  <script src="data/events.js" charset="utf-8"></script>
  <script src="/trips/shared/gallery.js" charset="utf-8"></script>
</body>
</html>
