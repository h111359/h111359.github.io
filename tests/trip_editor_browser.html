<!DOCTYPE html>
<!--
  trip_editor_browser.html: Dependency-free browser regression harness for trip authoring.
  Component: Trip editor tests; executes actual editor/gallery code with in-memory fixtures.
  No test changes repository files or contacts Drive/OpenAI.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip editor browser tests</title>
  <!-- Test presentation keeps results readable and embeds the real UI for inspection. -->
  <style>
    :root { --surface: #fff; /* Test surface */ --ink: #17212b; /* Test text */ --space: 1rem; }
    body { color: var(--ink); background: var(--surface); font-family: system-ui, sans-serif; margin: var(--space); }
    iframe { width: 100%; height: 34rem; border: 1px solid; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    button { padding: var(--space); }
  </style>
</head>
<body>
  <!-- Native button supports Enter/Space; live results announce deterministic pass/fail progress. -->
  <h1>Trip editor browser tests</h1>
  <button id="run" type="button">Run tests in memory</button>
  <pre id="results" role="status" aria-live="polite">Ready.</pre>
  <!-- Actual editor is exposed for visual inspection; fixture network access is blocked by CSP. -->
  <iframe id="editor" title="Trip editor test fixture"></iframe>
  <div id="gallery-fixtures"></div>
  <!-- Test runner fetches workspace code, injects mocked adapters and asserts real UI behavior. -->
  <script>
  const RESULTS = document.getElementById('results');
  let passed = 0, failed = 0;

  /** @param {boolean} condition - Assertion. @param {string} message - Failure description. @returns {void} */
  function assert(condition, message) { if (!condition) throw new Error(message); }

  /** @param {string} name - Check name. @param {Function} action - Test body. @returns {Promise<void>} */
  async function check(name, action) {
    try { await action(); passed++; RESULTS.textContent += `PASS ${name}\n`; }
    catch (error) { failed++; RESULTS.textContent += `FAIL ${name}: ${error.stack || error.message}\n`; }
  }

  /** @param {HTMLIFrameElement} frame - Fixture container. @param {string} source - HTML. @returns {Promise<Window>} Loaded same-origin frame. */
  function loadFrame(frame, source) {
    return new Promise(resolve => { frame.onload = () => resolve(frame.contentWindow); frame.srcdoc = source; });
  }

  /** @returns {Promise<void>} Run real editor logic with versioned memory storage and gallery fixtures. */
  async function runTests() {
    document.getElementById('run').disabled = true;
    RESULTS.textContent = ''; passed = 0; failed = 0;
    const source = await fetch('../trips/data_editor.html').then(response => response.text());
    // Disable only automatic connection/restoration; every function under test is the repository implementation.
    const fixture = source.replace('  initializeTripWorkflow();', '  buildTripForms();')
      .replace('<head>', '<head><meta http-equiv="Content-Security-Policy" content="img-src data:; connect-src \'none\'; frame-src \'none\'">');
    const editor = await loadFrame(document.getElementById('editor'), fixture);
    await editor.eval(`(async () => {
      window.confirm = () => true;
      window.alert = message => { throw new Error(message); };
      window.fixtureFiles = new Map();
      window.fixtureFail = false;
      window.nativeFolder = {
        getFileHandle: async (name, options = {}) => {
          if (!fixtureFiles.has('data/' + name) && !options.create) throw new DOMException('Missing file', 'NotFoundError');
          return {
            getFile: async () => ({ text: async () => fixtureFiles.get('data/' + name) }),
            createWritable: async () => {
              let pending;
              return { write: async text => { pending = text; }, close: async () => { fixtureFiles.set('data/' + name, pending); }, abort: async () => {} };
            }
          };
        },
        removeEntry: async name => { fixtureFiles.delete('data/' + name); }
      };
      tripApi = async (path, body = null) => {
        if (path.startsWith('/api/file')) {
          const query = new URL(path, 'http://test').searchParams;
          const key = query.get('path');
          if (!fixtureFiles.has(key)) { const error=new Error('Missing file'); error.code='not_found'; throw error; }
          const text = fixtureFiles.get(key);
          const name = key === 'trip-config.js' ? 'GALLERY_TRIP_CONFIG' : key === 'data/events.js' ? 'GALLERY_EVENT_INDEX' : 'GALLERY_ITEMS';
          return { text, version: text, value: new Function('let window={};' + text + ';return window.' + name)() };
        }
        if (path === '/api/commit') {
          if (fixtureFail) throw new Error('Injected save failure');
          for (const [key] of Object.entries(body.changes)) {
            if ((fixtureFiles.get(key) ?? null) !== body.versions[key]) throw new Error(key + ' changed on disk');
          }
          const versions = {};
          for (const [key, value] of Object.entries(body.changes)) {
            if (value === null) fixtureFiles.delete(key); else fixtureFiles.set(key, value);
            versions[key] = value;
          }
          return { versions };
        }
        if (path.startsWith('/api/registry-errors')) return { errors: [] };
        throw new Error('Unexpected fixture endpoint: ' + path);
      };
      window.resetFixture = async (helper = true) => {
        resetTripSelection();
        TRIP_STATE.trip = helper ? 'test' : '';
        directoryHandle = helper ? helperDirectory('test') : nativeFolder;
        const records = ['event-one','event-two'].map(slug => ({ slug, title: slug, data: 'data/' + slug + '.js' }));
        fixtureFiles.clear();
        fixtureFiles.set('data/events.js', assignmentSource('GALLERY_EVENT_INDEX', records));
        records.forEach(entry => fixtureFiles.set(entry.data, assignmentSource('GALLERY_ITEMS', [{ type: 'text', title: 'Story', body: '<p>Original</p>', desc: '' }])));
        const config = { language: 'bg', locale: 'bg-BG', heading: 'Trip', theme: { heroWash: 'pink', future: 'keep' }, labels: { events: 'Събития', close: 'Custom close' }, future: { nested: [1, true] } };
        fixtureFiles.set('trip-config.js', assignmentSource('GALLERY_TRIP_CONFIG', config));
        TRIP_STATE.config = config;
        TRIP_STATE.configVersion = fixtureFiles.get('trip-config.js');
        TRIP_STATE.presets = { bg: { locale: 'bg-BG', labels: {events: 'Събития', close: 'Затвори'} }, en: { locale: 'en-US', labels: {events: 'Events', close: 'Close'} } };
        fixtureFail = false;
        await loadEventsJs(); await loadEvent(0); stopRefreshPolling(); renderTripSettings();
      };
      await resetFixture();
    })()`);
    await check('Helper adapter preserves rich text and media corrections', async () => {
      const result = await editor.eval(`(async () => {
        items = [{ type:'text', title:'Story', body:'<b>Bold</b>\\nSecond', desc:'' }, { name:'photo.jpg', preview:'https://drive.google.com/file/d/synthetic_id/preview', desc:'<i>Caption</i>', visible:false, flipHorizontal:true, rotation:90 }];
        renderItems(); dirty = true; await saveEventDraft();
        return fixtureFiles.get('data/event-one.js');
      })()`);
      const value = new Function(`let window={};${result};return window.GALLERY_ITEMS;`)();
      assert(value[0].body === '<b>Bold</b><br>Second', 'Rich text was lost');
      assert(value[1].visible === false && value[1].rotation === 90 && value[1].flipHorizontal, 'Media state was lost');
    });
    await check('Manual folder adapter saves and retains current selection', async () => {
      const value = await editor.eval(`(async () => { await resetFixture(false); items[0].body='<em>Manual</em>'; renderItems(); dirty=true; await saveEventDraft(); return fixtureFiles.get('data/event-one.js'); })()`);
      assert(value.includes('<em>Manual</em>'), 'Manual adapter did not save');
    });
    await check('Registry reorder, saved identity lock and new empty part creation', async () => {
      assert(await editor.eval(`(async () => {
        await resetFixture(); eventRegistry.reverse(); registryChanged(); renderRegistryPanel();
        const locked = [...document.querySelectorAll('.reg-slug,.reg-data')].every(input => input.readOnly);
        await saveRegistryDraft();
        const stable=currentEventIndex === 1 && currentEventHandle.path === 'data/event-one.js' && locked;
        handleAddRegistryEntry();
        const row=elRegistryList.lastElementChild; row.querySelector('.reg-slug').value='event-new'; row.querySelector('.reg-title').value='New'; row.querySelector('.reg-data').value='data/event-new.js';
        await saveRegistryDraft();
        return stable && fixtureFiles.has('data/event-new.js') && eventRegistry.length===3;
      })()`), 'Reorder lost selection or identity fields were editable');
    });
    await check('Confirmed deletion removes registry and data together', async () => {
      assert(await editor.eval(`(async () => { await resetFixture(); await removePart(0); await saveRegistryDraft(); return !fixtureFiles.has('data/event-one.js') && eventRegistry.length===1 && currentEventIndex===-1; })()`), 'Delete-both failed');
    });
    await check('Localization preserves custom labels, unknown fields and heroWash', async () => {
      assert(await editor.eval(`(async () => { await resetFixture(); document.getElementById('setting-language').value='en'; changeTripLanguage(); await saveTripSettings(); return TRIP_STATE.config.locale==='en-US' && TRIP_STATE.config.labels.events==='Events' && TRIP_STATE.config.labels.close==='Custom close' && TRIP_STATE.config.theme.heroWash==='pink' && TRIP_STATE.config.future.nested[1]; })()`), 'Language switch lost custom config values');
    });
    await check('Failed preview save retains every dirty draft and original file', async () => {
      assert(await editor.eval(`(async () => {
        await resetFixture(); const original=fixtureFiles.get('trip-config.js');
        document.getElementById('setting-heading').value='Changed'; TRIP_STATE.configDirty=true; dirty=true; fixtureFail=true;
        try { await savePreviewDrafts(); return false; } catch (error) { return TRIP_STATE.configDirty && dirty && fixtureFiles.get('trip-config.js')===original; }
      })()`), 'Failure cleared drafts or changed files');
    });
    await check('Preview consent, save failure cancellation and encoded selected hash', async () => {
      assert(await editor.eval(`(async () => {
        await resetFixture(); let opens=0, closed=false, url='';
        window.open=()=>{ opens++; return { opener:null, close:()=>{closed=true;}, location:{replace:value=>{url=value;}} }; };
        dirty=true; window.confirm=()=>false; previewTrip(); if(opens!==0) return false;
        window.confirm=()=>true; fixtureFail=true; previewTrip();
        while(TRIP_STATE.busy) await new Promise(resolve=>setTimeout(resolve,5));
        if(!closed || url) return false;
        fixtureFail=false; previewTrip(); while(TRIP_STATE.busy) await new Promise(resolve=>setTimeout(resolve,5));
        return url.endsWith('/trips/test/index.html#event=event-one') && !dirty;
      })()`), 'Preview consent/failure/hash policy failed');
    });
    await check('Dirty trip switch cancellation preserves loaded content', async () => {
      assert(await editor.eval(`(async () => { await resetFixture(); dirty=true; window.confirm=()=>false; await selectTrip('other'); window.confirm=()=>true; return TRIP_STATE.trip==='test' && dirty && currentEventHandle.path==='data/event-one.js'; })()`), 'Cancelled switch changed state');
    });
    await check('Late polling results cannot replace a newly selected event', async () => {
      assert(await editor.eval(`(async () => {
        await resetFixture(); const old=currentEventHandle; let release;
        old.getFile=()=>new Promise(resolve=>{release=()=>resolve({text:async()=>assignmentSource('GALLERY_ITEMS',[{type:'text',body:'STALE'}])});});
        const pending=refreshSelectedEvent(false); await loadEvent(1); stopRefreshPolling(); release(); await pending;
        return currentEventIndex===1 && items[0].body==='<p>Original</p>';
      })()`), 'Late polling corrupted new event');
    });
    await check('Dirty polling keeps accepted version and detects stale save', async () => {
      assert(await editor.eval(`(async () => {
        await resetFixture(); dirty=true; fixtureFiles.set('data/event-one.js',assignmentSource('GALLERY_ITEMS',[{type:'text',body:'EXTERNAL'}]));
        await refreshSelectedEvent(false);
        try { await saveEventDraft(); return false; } catch(error) { return dirty && pendingExternalText!==null && items[0].body==='<p>Original</p>'; }
      })()`), 'Dirty polling accepted a conflicting version');
    });
    await check('AI key stays in tab memory and selection change cancels ownership', async () => {
      assert(await editor.eval(`(async () => {
        await resetFixture(); document.getElementById('openai-api-key').value='synthetic-test-key'; handleSetOpenAiKey();
        const retained=openAiApiKey==='synthetic-test-key'; let aborted=false;
        activeAiOperation={controller:{abort:()=>{aborted=true;}}}; resetTripSelection(); handleClearOpenAiKey();
        return retained && aborted && !openAiApiKey;
      })()`), 'AI state was not preserved/cancelled correctly');
    });
    await galleryChecks();
    RESULTS.textContent += `\n${passed} passed; ${failed} failed.\n`;
    document.body.dataset.result = failed ? 'fail' : 'pass';
    document.getElementById('run').disabled = false;
  }

  /** @returns {Promise<void>} Exercise actual shared controller with zero/one/multiple text-only parts. */
  async function galleryChecks() {
    const template = await fetch('../trips/template/index.html').then(response => response.text());
    const controller = await fetch('../trips/shared/gallery.js').then(response => response.text());
    const config = await fetch('../trips/template/trip-config.js').then(response => response.text());
    for (const count of [0, 1, 2]) await check(`Gallery supports ${count} part(s)`, async () => {
      const frame = document.createElement('iframe'); frame.title = `${count} part gallery fixture`;
      document.getElementById('gallery-fixtures').append(frame);
      const entries = Array.from({length:count}, (_, index) => ({slug:`event-20260914-${index}`,title:`Part ${index}`,data:`data/event-${index}.js`}));
      const fixtureLoader = `
        // srcdoc has an about: URL that cannot accept the gallery's real HTTP history URL.
        window.history.replaceState = (state,title,url) => { window.fixtureHash=url; };
        window.history.pushState = (state,title,url) => { window.fixtureHash=url; };
        const append=Element.prototype.appendChild;
        Element.prototype.appendChild=function(node){
          if(node.tagName==='SCRIPT' && node.id==='eventDataScript') {
            window.GALLERY_ITEMS=[{type:'text',title:'Fixture',body:'<p>Gallery fixture</p>',desc:''}];
            queueMicrotask(()=>node.dispatchEvent(new Event('load'))); return node;
          }
          return append.call(this,node);
        };
      `;
      const script = content => '<script>' + content + '<' + '/script>';
      const html = template.replace('../shared/gallery.css', '/trips/shared/gallery.css').replace(/<script[\s\S]*?<\/script>/g, '')
        .replace('</body>', script(config + ';window.GALLERY_EVENT_INDEX=' + JSON.stringify(entries) + ';' + fixtureLoader + controller) + '</body>');
      const gallery = await loadFrame(frame, html);
      await new Promise(resolve => setTimeout(resolve, 50));
      if (count) assert(gallery.document.getElementById('gallery').textContent.includes('Gallery fixture'), 'Selected event did not render');
      else assert(gallery.document.body.textContent.includes('Все още няма добавени части.'), 'Neutral empty-trip state missing');
    });
  }
  document.getElementById('run').addEventListener('click', () => runTests().catch(error => {
    RESULTS.textContent += `FATAL ${error.stack}\n`; document.body.dataset.result='fail';
  }));
  if (new URLSearchParams(location.search).has('autorun')) document.getElementById('run').click();
  </script>
</body>
</html>
